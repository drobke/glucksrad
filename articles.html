<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deutsche Artikel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;500&family=Noto+Serif:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell practice-page">
      <nav class="app-nav" aria-label="Glavni meni">
        <a href="index.html">Točak sreće</a>
        <a href="prepositions.html">Präpositionen</a>
        <a href="articles.html" class="is-active">Artikel</a>
      </nav>
      <header>
        <p class="eyebrow">Deutsch üben · Wort für Wort</p>
        <h1>Deutsche <em>Artikel</em></h1>
        <p class="intro">Wähle der, die oder das. Nach deiner Antwort geht es in 5 Sekunden weiter.</p>
      </header>

      <section class="preposition-game" aria-labelledby="articlePrompt">
        <p class="label">Welcher Artikel passt?</p>
        <h2 id="articlePrompt" class="preposition-prompt"></h2>
        <div id="articleOptions" class="preposition-options article-options" aria-live="polite"></div>
        <p id="articleFeedback" class="preposition-feedback" aria-live="assertive"></p>
      </section>

      <section class="preposition-score" aria-label="Ergebnis">
        <div>
          <p class="label">Dein Ergebnis</p>
          <p><strong id="articleCorrect">0</strong> Richtig</p>
          <p><strong id="articleWrong">0</strong> Falsch</p>
        </div>
        <button id="resetArticleScore" type="button" class="score-reset">Punkte zurücksetzen</button>
      </section>
      <footer>Viel Erfolg beim Üben!</footer>
    </main>
    <script src="articles-data.js"></script>
    <script src="articles.js"></script>
  </body>
</html>
