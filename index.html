<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uros' Glücksrad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header>
        <div class="language-switch" aria-label="Sprache auswählen">
          <button type="button" data-language="de" class="is-active">Deutsch</button>
          <button type="button" data-language="sr">Srpski</button>
        </div>
        <p id="eyebrow" class="eyebrow">Deutsch lernen · spielerisch</p>
        <h1 id="headline">Uros’ <em>Glücksrad</em></h1>
        <p id="intro" class="intro">Dreh das Rad und entdecke dein nächstes deutsches Wort.</p>
      </header>

      <section class="category-picker" aria-label="Wortkategorie auswählen">
        <p id="categoryLabel" class="label">Kategorie auswählen</p>
        <div id="categoryButtons" class="category-buttons"></div>
      </section>

      <section class="game" aria-label="Glücksrad mit deutschen Wörtern">
        <div class="wheel-stage">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="900" height="900" aria-label="Drehbares Glücksrad"></canvas>
          <div class="wheel-center" aria-hidden="true"><span>LOS</span></div>
        </div>

        <aside class="controls">
          <p id="wordLabel" class="label">Dein Wort</p>
          <div class="word-display" aria-live="polite" aria-atomic="true">
            <span id="resultWord">Bereit?</span>
          </div>
          <p id="resultHint" class="result-hint">Wähle eine Kategorie und drücke auf „Drehen“.</p>
          <button id="spinButton" type="button"><span id="spinText">Rad drehen</span> <span aria-hidden="true">↻</span></button>
          <button id="mixButton" type="button" class="mix-button" hidden>Neue Mischung</button>
          <div class="answer-buttons" aria-label="Antwort bewerten">
            <button id="correctButton" type="button" class="correct" disabled>✓ <span id="correctText">Richtig</span></button>
            <button id="wrongButton" type="button" class="wrong" disabled>✕ <span id="wrongText">Falsch</span></button>
          </div>
          <button id="resetButton" type="button" class="reset">Neu beginnen</button>
          <p class="spin-count"><span id="spinCount">0</span> <span id="spinsText">Drehungen</span></p>
        </aside>
      </section>

      <section class="score-card" aria-labelledby="scoreTitle">
        <div class="score-card-head">
          <div>
            <p id="progressLabel" class="label">Lernfortschritt</p>
            <h2 id="scoreTitle">Deine Punkte</h2>
          </div>
          <button id="resetScoresButton" class="score-reset" type="button">Punkte zurücksetzen</button>
        </div>
        <div id="scoreTable" class="score-table" aria-live="polite"></div>
      </section>

      <footer>Viel Glück beim Lernen!</footer>
    </main>
    <script src="vocabulary.js"></script>
    <script src="script.js"></script>
  </body>
</html>
