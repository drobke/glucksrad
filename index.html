<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урошев точак среће</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header>
        <div class="language-switch" aria-label="Изабери језик">
          <button type="button" data-language="de">Deutsch</button>
          <button type="button" data-language="sr" class="is-active">Srpski</button>
        </div>
        <p id="eyebrow" class="eyebrow">Учење немачког · кроз игру</p>
        <h1 id="headline">Урошев <em>точак среће</em></h1>
        <p id="intro" class="intro">Заврти точак и откриј следећу немачку реч.</p>
      </header>

      <section class="category-picker" aria-label="Изабери категорију">
        <p id="categoryLabel" class="label">Изабери категорију</p>
        <div id="categoryButtons" class="category-buttons"></div>
      </section>

      <section class="game" aria-label="Glücksrad mit deutschen Wörtern">
        <div class="wheel-stage" id="wheelStage">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="900" height="900" aria-label="Drehbares Glücksrad"></canvas>
          <div class="wheel-center" aria-hidden="true"><img src="assets/uros-wheel-center.png" alt="" /></div>
        </div>

        <aside class="controls">
          <p id="wordLabel" class="label">Твоја реч</p>
          <div class="word-display" aria-live="polite" aria-atomic="true">
            <span id="resultWord">Спремни?</span>
          </div>
          <p id="resultHint" class="result-hint">Изабери категорију и притисни „Заврти точак“.</p>
          <button id="spinButton" type="button"><span id="spinText">Заврти точак</span> <span aria-hidden="true">↻</span></button>
          <button id="mixButton" type="button" class="mix-button" hidden>Neue Mischung</button>
          <button id="answerButton" type="button" class="answer-reveal" disabled>💡 <span id="answerText">Lösung zeigen</span></button>
          <div class="answer-buttons" aria-label="Antwort bewerten">
            <button id="correctButton" type="button" class="correct" disabled>✓ <span id="correctText">Richtig</span></button>
            <button id="wrongButton" type="button" class="wrong" disabled>✕ <span id="wrongText">Falsch</span></button>
          </div>
          <button id="resetButton" type="button" class="reset">Neu beginnen</button>
          <p class="spin-count"><span id="spinCount">0</span> <span id="spinsText">Drehungen</span></p>
        </aside>
      </section>

      <section class="score-card" aria-labelledby="scoreTitle">
        <div class="score-card-head">
          <div>
            <p id="progressLabel" class="label">Lernfortschritt</p>
            <h2 id="scoreTitle">Deine Punkte</h2>
          </div>
          <button id="resetScoresButton" class="score-reset" type="button">Punkte zurücksetzen</button>
        </div>
        <div id="scoreTable" class="score-table" aria-live="polite"></div>
      </section>

      <footer>Viel Glück beim Lernen!</footer>
    </main>
    <div id="answerModal" class="answer-modal" role="dialog" aria-modal="true" aria-labelledby="answerModalTitle" hidden>
      <div class="answer-modal-card">
        <button id="closeAnswerModal" class="modal-close" type="button" aria-label="Close">×</button>
        <p id="answerModalLabel" class="label">Die richtige Antwort</p>
        <h2 id="answerModalTitle"></h2>
      </div>
    </div>
    <script src="vocabulary.js"></script>
    <script src="script.js"></script>
  </body>
</html>
